<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Decorative rings -->
  <circle cx="920" cy="150" r="200" fill="none" stroke="url(#ring)" stroke-width="1"/>
  <circle cx="920" cy="150" r="160" fill="none" stroke="url(#ring)" stroke-width="0.5"/>
  <circle cx="920" cy="150" r="120" fill="none" stroke="url(#ring)" stroke-width="0.5"/>

  <!-- Gear/decorative element (simple) -->
  <g transform="translate(920, 150)" opacity="0.08">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#58a6ff" stroke-width="1"/>
    <line x1="-60" y1="0" x2="-45" y2="0" stroke="#58a6ff" stroke-width="4"/>
    <line x1="45" y1="0" x2="60" y2="0" stroke="#58a6ff" stroke-width="4"/>
    <line x1="0" y1="-60" x2="0" y2="-45" stroke="#58a6ff" stroke-width="4"/>
    <line x1="0" y1="45" x2="0" y2="60" stroke="#58a6ff" stroke-width="4"/>
  </g>

  <!-- Main text -->
  <text x="80" y="125" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="62" font-weight="700" fill="#e6edf3">🤖 Ubundi Work Agent</text>

  <!-- Accent line -->
  <rect x="80" y="150" width="320" height="4" rx="2" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="80" y="195" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400" fill="#8b949e">Turning reviewed intent into concrete artifacts</text>
  <text x="80" y="225" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="300" fill="#484f58">Company Execution Agent · Kwanda Operating System</text>

  <!-- Subtle bottom text -->
  <text x="80" y="275" font-family="monospace" font-size="13" font-weight="400" fill="#30363d">github.com/TeamUbundi</text>
</svg>
